name: msdss

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  medusa:
    build: ./backend
    image: msdss-medusa:2.22.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Medusa 保留在 Docker 內部；原本對外的 8000 改由 gateway 接收。
    expose:
      - "9000"
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: ${PUBLIC_URL},${STOREFRONT_URL:-http://localhost:3000},http://localhost:8000
      ADMIN_CORS: ${PUBLIC_URL},http://localhost:8000
      AUTH_CORS: ${PUBLIC_URL},${STOREFRONT_URL:-http://localhost:3000},http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDUSA_ADMIN_ONBOARDING_TYPE: default
    volumes:
      - uploads:/app/.medusa/server/static/uploads
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  gateway:
    build:
      context: .
      dockerfile: sentinel/gateway/Dockerfile
    image: msdss-gateway:v6
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    ports:
      - "${MEDUSA_PORT:-8000}:8080"
    environment:
      MEDUSA_UPSTREAM: http://medusa:9000
      GATEWAY_MODEL_DIR: /app/sentinel/gateway/model
      GATEWAY_ANALYSIS_TIMEOUT: "0.2"
    # 單一 worker 與既有推論工作上限一致；模型告警只觀察，仍轉送 Medusa。
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  storefront:
    build:
      context: ./storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set the storefront publishable key}
        NEXT_PUBLIC_BASE_URL: ${STOREFRONT_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-gb}
    image: msdss-storefront:1.0.3
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${STOREFRONT_PORT:-3000}:8000"
    environment:
      NODE_ENV: production
      # SSR 與 server actions 也經 gateway，避免只偵測瀏覽器直接發出的請求。
      MEDUSA_BACKEND_URL: http://gateway:8080
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_BASE_URL: ${STOREFRONT_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-gb}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

volumes:
  api_logs:
  postgres_data:
  redis_data:
  uploads:
